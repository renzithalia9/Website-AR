<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web-AR Jaring-Jaring Bangun Ruang</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #000;
        }

        /* FIX LAYAR HITAM — jangan override canvas AR.js */
        a-scene { display: block; }

        #info-box {
            position: fixed;
            top: 15px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0,0,0,0.78);
            color: white;
            padding: 10px 16px;
            border-radius: 15px;
            font-size: 13px;
            text-align: center;
            width: 88%; max-width: 400px;
            pointer-events: none;
        }

        #menu-container {
            position: fixed;
            bottom: 24px; left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            gap: 6px;
            background: rgba(255,255,255,0.22);
            padding: 8px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            width: 92%; max-width: 380px;
        }

        .menu-btn {
            flex: 1;
            background: white;
            color: #333;
            border: none;
            padding: 12px 0;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-btn.active {
            background: #FF5722;
            color: white;
        }

        /* OVERLAY JARING — tampil di atas kamera */
        #net-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 9998;
            background: rgba(0,0,0,0.82);
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        #net-overlay.show { display: flex; }

        #net-overlay canvas {
            border-radius: 14px;
            background: #0d0d1f;
            border: 1px solid rgba(255,255,255,0.1);
            max-width: 100%;
            max-height: 55vh;
        }

        #net-info {
            margin-top: 14px;
            text-align: center;
            color: #fff;
        }
        #net-info .name { font-size: 17px; font-weight: 700; margin-bottom: 5px; }
        #net-info .desc { font-size: 12px; color: #94a3b8; line-height: 1.6; }

        #close-net {
            margin-top: 16px;
            padding: 10px 32px;
            border-radius: 20px;
            background: #FF5722;
            color: #fff;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

<div id="info-box">Arahkan ke Marker HIRO · Pilih bangun · Tap objek untuk jaring-jaring</div>

<div id="menu-container">
    <button class="menu-btn active" onclick="switchShape('kubus',this)">Kubus</button>
    <button class="menu-btn" onclick="switchShape('limas',this)">Limas</button>
    <button class="menu-btn" onclick="switchShape('tabung',this)">Tabung</button>
    <button class="menu-btn" onclick="switchShape('kerucut',this)">Kerucut</button>
</div>

<!-- OVERLAY JARING-JARING -->
<div id="net-overlay">
    <canvas id="netCanvas" width="320" height="320"></canvas>
    <div id="net-info">
        <div class="name" id="net-name"></div>
        <div class="desc" id="net-desc"></div>
    </div>
    <button id="close-net" onclick="hideNet()">✕ Tutup</button>
</div>

<a-scene
    arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    vr-mode-ui="enabled: false"
    loading-screen="enabled: false"
>
    <a-marker preset="hiro">
        <a-entity id="marker-content" data-active="kubus" scale="0.6 0.6 0.6">

            <!-- KUBUS -->
            <a-entity id="group-kubus" visible="true" position="0 0.2 0">
                <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" color="#4CC3D9" material="side:double"></a-plane>
                <a-entity id="k-depan" position="0 0 0.5">
                    <a-plane position="0 0.5 0" rotation="0 0 0" width="1" height="1" color="#FFC65D" material="side:double"></a-plane>
                    <a-entity id="k-atas" position="0 1 0">
                        <a-plane position="0 0.5 0" rotation="-90 0 0" width="1" height="1" color="#E74C3C" material="side:double"></a-plane>
                    </a-entity>
                </a-entity>
                <a-entity id="k-belakang" position="0 0 -0.5">
                    <a-plane position="0 0.5 0" rotation="90 0 0" width="1" height="1" color="#16A085" material="side:double"></a-plane>
                </a-entity>
                <a-entity id="k-kiri" position="-0.5 0 0">
                    <a-plane position="0 0.5 0" rotation="0 90 -90" width="1" height="1" color="#9B59B6" material="side:double"></a-plane>
                </a-entity>
                <a-entity id="k-kanan" position="0.5 0 0">
                    <a-plane position="0 0.5 0" rotation="0 -90 90" width="1" height="1" color="#2ECC71" material="side:double"></a-plane>
                </a-entity>
            </a-entity>

            <!-- LIMAS -->
            <a-entity id="group-limas" visible="false" position="0 0 0">
                <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" color="#34495E" material="side:double"></a-plane>
                <a-entity id="l-depan" position="0 0 0.5">
                    <a-triangle position="0 0.43 0" rotation="-30 0 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#E67E22" material="side:double"></a-triangle>
                </a-entity>
                <a-entity id="l-belakang" position="0 0 -0.5">
                    <a-triangle position="0 0.43 0" rotation="-30 180 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#9B59B6" material="side:double"></a-triangle>
                </a-entity>
                <a-entity id="l-kiri" position="-0.5 0 0">
                    <a-triangle position="0 0.43 0" rotation="-30 90 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#1ABC9C" material="side:double"></a-triangle>
                </a-entity>
                <a-entity id="l-kanan" position="0.5 0 0">
                    <a-triangle position="0 0.43 0" rotation="-30 -90 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#F1C40F" material="side:double"></a-triangle>
                </a-entity>
            </a-entity>

            <!-- TABUNG -->
            <a-entity id="group-tabung" visible="false" position="0 0 0">
                <a-circle position="0 0 0" rotation="-90 0 0" radius="0.5" color="#2980B9" material="side:double"></a-circle>
                <a-entity id="t-atas" position="0 1 0">
                    <a-circle position="0 0 0" rotation="-90 0 0" radius="0.5" color="#2980B9" material="side:double"></a-circle>
                </a-entity>
                <a-cylinder id="t-selimut" position="0 0.5 0" radius="0.5" height="1" open-ended="true" color="#E74C3C" material="side:double"></a-cylinder>
            </a-entity>

            <!-- KERUCUT -->
            <a-entity id="group-kerucut" visible="false" position="0 0.5 0">
                <a-entity id="kr-alas" position="0 -0.5 0">
                    <a-circle rotation="-90 0 0" radius="0.5" color="#27AE60" material="side:double"></a-circle>
                </a-entity>
                <a-cone id="kr-selimut" position="0 0 0" radius-bottom="0.5" radius-top="0" height="1" open-ended="true" color="#F39C12" material="side:double"></a-cone>
            </a-entity>

        </a-entity>
    </a-marker>
    <a-entity camera></a-entity>
</a-scene>

<script>
/* ── DATA JARING ── */
const DATA = {
    kubus: {
        name: 'Kubus',
        desc: '6 sisi persegi · 12 rusuk · 8 sudut\nLuas = 6s² · Volume = s³',
        draw(ctx, W, H) {
            ctx.clearRect(0,0,W,H);
            const s = Math.min(W,H) / 5.2, ox = W/2 - s*2, oy = 8;
            const colors = ['#4CC3D9','#FFC65D','#E74C3C','#16A085','#9B59B6','#2ECC71'];
            const layout = [[1,0],[0,1],[1,1],[2,1],[3,1],[1,2],[1,3]];
            layout.forEach(([c,r], i) => {
                ctx.fillStyle = colors[i % colors.length];
                ctx.fillRect(ox+c*s, oy+r*s, s, s);
                ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
                ctx.strokeRect(ox+c*s, oy+r*s, s, s);
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px Segoe UI';
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                if(i>0) ctx.fillText('ABCDEF'[i-1], ox+c*s+s/2, oy+r*s+s/2);
            });
        }
    },
    limas: {
        name: 'Limas Segi-4',
        desc: '1 alas persegi + 4 sisi segitiga · 8 rusuk · 5 sudut\nVolume = ⅓ × alas × tinggi',
        draw(ctx, W, H) {
            ctx.clearRect(0,0,W,H);
            const s = Math.min(W,H)/4, h = s*1.0, cx = W/2, oy = 10;
            // Alas
            ctx.fillStyle='#34495E'; ctx.fillRect(cx-s/2, oy+h, s, s);
            ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(cx-s/2, oy+h, s, s);
            lbl(ctx,'Alas', cx, oy+h+s/2);
            // 4 segitiga
            const tris = [
                {ax:cx,ay:oy, bx:cx-s/2,by:oy+h, cx:cx+s/2,cy:oy+h, c:'#E67E22', l:'Depan'},
                {ax:cx,ay:oy+h+s+h, bx:cx-s/2,by:oy+h+s, cx:cx+s/2,cy:oy+h+s, c:'#9B59B6', l:'Belakang'},
                {ax:cx-s/2-h*.6,ay:oy+h+s/2, bx:cx-s/2,by:oy+h, cx:cx-s/2,cy:oy+h+s, c:'#1ABC9C', l:'Kiri'},
                {ax:cx+s/2+h*.6,ay:oy+h+s/2, bx:cx+s/2,by:oy+h, cx:cx+s/2,cy:oy+h+s, c:'#F1C40F', l:'Kanan'},
            ];
            tris.forEach(t => {
                ctx.beginPath(); ctx.moveTo(t.ax,t.ay); ctx.lineTo(t.bx,t.by); ctx.lineTo(t.cx,t.cy); ctx.closePath();
                ctx.fillStyle=t.c; ctx.fill(); ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
                lbl(ctx, t.l, (t.ax+t.bx+t.cx)/3, (t.ay+t.by+t.cy)/3);
            });
        }
    },
    tabung: {
        name: 'Tabung',
        desc: '2 lingkaran + 1 selimut persegi panjang\nLuas = 2πr² + 2πrt · Volume = πr²t',
        draw(ctx, W, H) {
            ctx.clearRect(0,0,W,H);
            const r = Math.min(W/6, 40), cw = Math.PI*2*r, ch = Math.min(H/3, 100), cx = W/2, oy = 12;
            // Selimut
            ctx.fillStyle='#E74C3C'; ctx.fillRect(cx-cw/2, oy+r*2+8, cw, ch);
            ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.strokeRect(cx-cw/2, oy+r*2+8, cw, ch);
            lbl(ctx,'Selimut (2πr × t)', cx, oy+r*2+8+ch/2);
            // Lingkaran atas & bawah
            [[cx, oy+r, 'Tutup'], [cx, oy+r*2+8+ch+r, 'Alas']].forEach(([x,y,lb]) => {
                ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2);
                ctx.fillStyle='#2980B9'; ctx.fill();
                ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
                lbl(ctx, lb, x, y);
            });
        }
    },
    kerucut: {
        name: 'Kerucut',
        desc: '1 alas lingkaran + 1 selimut juring\nLuas = πr² + πrs · Volume = ⅓πr²t',
        draw(ctx, W, H) {
            ctx.clearRect(0,0,W,H);
            const cx=W/2, cy=H*0.38, r=Math.min(W/6,40), s=Math.min(W/2.2,115);
            // Juring selimut
            ctx.beginPath(); ctx.moveTo(cx,cy);
            ctx.arc(cx,cy,s,-Math.PI*.82,Math.PI*.02); ctx.closePath();
            ctx.fillStyle='#F39C12'; ctx.fill();
            ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
            lbl(ctx,'Selimut (Juring)', cx-10, cy-36);
            // Alas lingkaran
            const ay = cy+s-r+Math.min(48, H*.12);
            ctx.beginPath(); ctx.arc(cx, ay, r, 0, Math.PI*2);
            ctx.fillStyle='#27AE60'; ctx.fill();
            ctx.strokeStyle='#fff'; ctx.lineWidth=1.5; ctx.stroke();
            lbl(ctx,'Alas', cx, ay);
        }
    }
};

function lbl(ctx, t, x, y) {
    ctx.fillStyle='rgba(255,255,255,0.9)';
    ctx.font='bold 10px Segoe UI,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(t, x, y);
}

/* ── STATE ── */
let currentShape = 'kubus';

/* ── SWITCH SHAPE ── */
function switchShape(name, btn) {
    currentShape = name;
    ['kubus','limas','tabung','kerucut'].forEach(s => {
        const g = document.querySelector('#group-'+s);
        if(g) g.setAttribute('visible', s===name);
    });
    document.querySelector('#marker-content').setAttribute('data-active', name);
    document.querySelector('#info-box').innerText = 'Arahkan ke Marker HIRO · Tap objek untuk jaring-jaring ' + name;
    document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
    if(btn) btn.classList.add('active');
    hideNet();
}

/* ── SHOW / HIDE NET ── */
function showNet() {
    const d = DATA[currentShape];
    document.getElementById('net-name').textContent = d.name;
    document.getElementById('net-desc').textContent = d.desc;

    const canvas = document.getElementById('netCanvas');
    const wrap = canvas.parentElement;
    const W = Math.min(wrap.clientWidth - 40, 320);
    const H = Math.min(window.innerHeight * 0.52, 340);
    canvas.width = W; canvas.height = H;

    d.draw(canvas.getContext('2d'), W, H);
    document.getElementById('net-overlay').classList.add('show');
    document.getElementById('info-box').innerText = 'Jaring-jaring ' + d.name + ' · Tap Tutup untuk kembali';
}

function hideNet() {
    document.getElementById('net-overlay').classList.remove('show');
    document.getElementById('info-box').innerText = 'Arahkan ke Marker HIRO · Tap objek untuk jaring-jaring ' + currentShape;
}

/* ── TAP HANDLER — works on HP & desktop ── */
function setupTap() {
    const scene = document.querySelector('a-scene');

    // Desktop: klik biasa
    scene.addEventListener('click', function(e) {
        if(e.target.closest('#net-overlay') || e.target.closest('#menu-container')) return;
        showNet();
    });

    // HP: touchend di area kamera (bukan UI)
    document.addEventListener('touchend', function(e) {
        const t = e.target;
        if(t.closest('#net-overlay') || t.closest('#menu-container') || t.closest('#info-box')) return;
        showNet();
    }, {passive: true});
}

document.querySelector('a-scene').addEventListener('loaded', setupTap);
// fallback jika loaded sudah lewat
setTimeout(setupTap, 3000);
</script>
</body>
</html>
