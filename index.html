<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AR Marker Hiro Bangun Ruang</title>

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      overflow: hidden;
      background: #000;
    }

    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 10;
      padding: 15px;
      color: white;
      text-align: center;
      background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
    }

    .overlay h1 {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .overlay p {
      font-size: 14px;
      opacity: 0.9;
    }

    .info-box {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 350px;
      background: rgba(0,0,0,0.8);
      color: white;
      padding: 15px;
      border-radius: 20px;
      z-index: 10;
      text-align: center;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .info-box h2 {
      margin-bottom: 10px;
      color: cyan;
    }

    .btn {
      margin-top: 12px;
      padding: 10px 18px;
      border: none;
      border-radius: 12px;
      background: cyan;
      color: black;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.05);
      background: white;
    }

    .jaring {
      display: none;
      margin-top: 15px;
      padding: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      white-space: pre-line;
      line-height: 1.8;
      font-size: 18px;
    }

    .marker-box {
      position: fixed;
      right: 10px;
      top: 90px;
      width: 110px;
      background: rgba(255,255,255,0.95);
      padding: 8px;
      border-radius: 12px;
      z-index: 10;
      text-align: center;
    }

    .marker {
      width: 100%;
      aspect-ratio: 1/1;
      background: black;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 22px;
    }

    @media(max-width:600px){
      .overlay h1{
        font-size:20px;
      }
    }
  </style>
</head>
<body>

  <div class="overlay">
    <h1>AR Marker Hiro Bangun Ruang</h1>
    <p>Arahkan kamera HP ke marker Hiro untuk menampilkan objek 3D</p>
  </div>

  <div class="marker-box">
    <div class="marker">HIRO</div>
    <small>Marker Hiro</small>
  </div>

  <div class="info-box">
    <h2>Kubus 3D</h2>
    <p>Sentuh atau klik bangun ruang 3D untuk membuka jaring-jaring.</p>

    <button class="btn">
      Klik Bangun 3D
    </button>

    <div class="jaring" id="jaringBox">
⬜ ⬜ ⬜
    ⬜
⬜ ⬜
    </div>
  </div>

  <a-scene
    embedded
    arjs="sourceType: webcam; debugUIEnabled: false;"
    vr-mode-ui="enabled: false"
    renderer="logarithmicDepthBuffer: true;"
  >

    <a-marker preset="hiro">

      <!-- Kubus -->
      <a-box
        cursor-listener
        id="kubus"
        position="0 0.5 0"
        rotation="0 45 0"
        color="#00FFFF"
        depth="1"
        height="1"
        width="1"
        animation="property: rotation; to: 0 405 0; loop: true; dur: 6000"
      ></a-box>

      <!-- Text -->
      <a-text
        value="Kubus"
        position="-0.5 1.3 0"
        color="white"
        scale="1.5 1.5 1.5"
      ></a-text>

    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    AFRAME.registerComponent('cursor-listener', {
      init: function () {
        this.el.addEventListener('click', function () {
          toggleJaring();
        });
      }
    });

    function toggleJaring() {
      const box = document.getElementById('jaringBox');

      if (box.style.display === 'block') {
        box.style.display = 'none';
      } else {
        box.style.display = 'block';
      }
    }
  </script>

</body>
</html>
