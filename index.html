<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <title>Web-AR Jaring-Jaring Bangun Ruang</title>
    <!-- Library A-Frame dan AR.js -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family: "Segoe UI", Roboto, sans-serif;
      }

      /* UI Teks Instruksi */
      #info-box {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        background: rgba(0, 0, 0, 0.75);
        color: white;
        padding: 10px 20px;
        border-radius: 20px;
        font-size: 14px;
        text-align: center;
        width: 80%;
        pointer-events: none;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      }

      /* UI Menu Pilihan Bangun Ruang di HP */
      #menu-container {
        position: fixed;
        bottom: 30px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 10;
        display: flex;
        gap: 10px;
        background: rgba(255, 255, 255, 0.2);
        padding: 10px;
        border-radius: 30px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      .menu-btn {
        background: white;
        color: #333;
        border: none;
        padding: 10px 16px;
        border-radius: 20px;
        font-weight: bold;
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .menu-btn.active {
        background: #ff5722;
        color: white;
        transform: scale(1.1);
      }
    </style>
  </head>

  <body>
    <div id="info-box">
      Arahkan kamera ke Marker HIRO, pilih bangun ruang di bawah, lalu ketuk
      objeknya!
    </div>

    <div id="menu-container">
      <button class="menu-btn active" onclick="switchShape('kubus')">
        Kubus
      </button>
      <button class="menu-btn" onclick="switchShape('limas')">Limas</button>
      <button class="menu-btn" onclick="switchShape('tabung')">Tabung</button>
      <button class="menu-btn" onclick="switchShape('kerucut') font-size">
        Kerucut
      </button>
    </div>

    <script>
      // Logika global untuk melacak status buka/tutup
      let isOpen = false;

      // Komponen Interaksi Klik untuk Jaring-Jaring
      AFRAME.registerComponent("shape-interaction", {
        init: function () {
          let el = this.el;

          el.addEventListener("click", function () {
            let activeShape = document
              .querySelector("#marker-content")
              .getAttribute("data-active");
            let info = document.querySelector("#info-box");

            if (!isOpen) {
              // NYALAKAN ANIMASI MEMBUKA JARING-JARING
              if (activeShape === "kubus") {
                document
                  .querySelector("#k-depan")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 90 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#k-belakang")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: -90 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#k-kiri")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 0 0 90; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#k-kanan")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 0 0 -90; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#k-atas")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 90 0 0; dur: 1200; easing: easeOutQuad"
                  );
              } else if (activeShape === "limas") {
                document
                  .querySelector("#l-depan")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 60 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#l-belakang")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: -60 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#l-kiri")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 0 0 60; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#l-kanan")
                  .setAttribute(
                    "animation",
                    "property: rotation; to: 0 0 -60; dur: 1200; easing: easeOutQuad"
                  );
              } else if (activeShape === "tabung") {
                // Selimut menggelinding menjauh, tutup atas terbuka
                document
                  .querySelector("#t-selimut")
                  .setAttribute(
                    "animation",
                    "property: position; to: 0 0 1.2; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#t-selimut")
                  .setAttribute(
                    "animation__rot",
                    "property: rotation; to: -90 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#t-atas")
                  .setAttribute(
                    "animation",
                    "property: position; to: 0 1 0; dur: 1200; easing: easeOutQuad"
                  );
              } else if (activeShape === "kerucut") {
                // Selimut bergeser dan alas membuka
                document
                  .querySelector("#kr-selimut")
                  .setAttribute(
                    "animation",
                    "property: position; to: -0.6 0 0; dur: 1200; easing: easeOutQuad"
                  );
                document
                  .querySelector("#kr-alas")
                  .setAttribute(
                    "animation",
                    "property: position; to: 0.6 -0.5 0; dur: 1200; easing: easeOutQuad"
                  );
              }

              info.innerText =
                "Jaring-jaring terbuka! Ketuk objek lagi untuk melipat kembali.";
              isOpen = true;
            } else {
              // KEMBALIKAN KE BENTUK 3D SEMULA (MENUTUP)
              resetAnimations();
              info.innerText = "Ketuk objek untuk melihat jaring-jaring.";
              isOpen = false;
            }
          });
        },
      });

      // Fungsi Reset Animasi saat ditutup atau ganti menu
      function resetAnimations() {
        isOpen = false;
        // Reset Kubus
        document
          .querySelectorAll('[id^="k-"]')
          .forEach((el) => el.removeAttribute("animation"));
        // Reset Limas
        document
          .querySelectorAll('[id^="l-"]')
          .forEach((el) => el.removeAttribute("animation"));
        // Reset Tabung / Kerucut posisi manual ke awal
        document.querySelector("#t-selimut").removeAttribute("animation");
        document.querySelector("#t-selimut").removeAttribute("animation__rot");
        document
          .querySelector("#t-selimut")
          .setAttribute("position", "0 0.5 0");
        document.querySelector("#t-selimut").setAttribute("rotation", "0 0 0");
        document.querySelector("#t-atas").removeAttribute("animation");
        document.querySelector("#t-atas").setAttribute("position", "0 1 0");

        document.querySelector("#kr-selimut").removeAttribute("animation");
        document.querySelector("#kr-selimut").setAttribute("position", "0 0 0");
        document.querySelector("#kr-alas").removeAttribute("animation");
        document.querySelector("#kr-alas").setAttribute("position", "0 -0.5 0");
      }

      // Fungsi Ganti Bangun Ruang dari Tombol Menu
      function switchShape(shapeName) {
        resetAnimations();

        // Atur visibility di HTML
        document
          .querySelector("#group-kubus")
          .setAttribute("visible", shapeName === "kubus");
        document
          .querySelector("#group-limas")
          .setAttribute("visible", shapeName === "limas");
        document
          .querySelector("#group-tabung")
          .setAttribute("visible", shapeName === "tabung");
        document
          .querySelector("#group-kerucut")
          .setAttribute("visible", shapeName === "kerucut");

        document
          .querySelector("#marker-content")
          .setAttribute("data-active", shapeName);
        document.querySelector("#info-box").innerText =
          "Ketuk objek untuk melihat jaring-jaring " + shapeName + ".";

        // Atur gaya tombol aktif
        document
          .querySelectorAll(".menu-btn")
          .forEach((btn) => btn.classList.remove("active"));
        event.target.classList.add("active");
      }
    </script>

    <!-- Scene AR -->
    <a-scene
      embedded
      arjs="sourceType: webcam; debugUIEnabled: false;"
      cursor="rayorigin: mouse"
      raycaster="objects: .clickable"
    >
      <a-marker preset="hiro">
        <!-- Container Utama -->
        <a-entity
          id="marker-content"
          data-active="kubus"
          class="clickable"
          shape-interaction
          position="0 0 0"
          scale="0.6 0.6 0.6"
        >
          <!-- ==================== 1. BANGUN: KUBUS ==================== -->
          <a-entity id="group-kubus" visible="true" position="0 0.2 0">
            <!-- Alas tetap -->
            <a-plane
              position="0 0 0"
              rotation="-90 0 0"
              width="1"
              height="1"
              color="#4CC3D9"
              material="side: double;"
            ></a-plane>
            <!-- Sisi Depan & Atas -->
            <a-entity id="k-depan" position="0 0 0.5">
              <a-plane
                position="0 0.5 0"
                width="1"
                height="1"
                color="#FFC65D"
                material="side: double;"
              ></a-plane>
              <a-entity id="k-atas" position="0 1 0">
                <a-plane
                  position="0 0.5 0"
                  width="1"
                  height="1"
                  color="#E74C3C"
                  material="side: double;"
                ></a-plane>
              </a-entity>
            </a-entity>
            <!-- Sisi Belakang -->
            <a-entity id="k-belakang" position="0 0 -0.5">
              <a-plane
                position="0 0.5 0"
                rotation="180 0 0"
                width="1"
                height="1"
                color="#16A085"
                material="side: double;"
              ></a-plane>
            </a-entity>
            <!-- Sisi Kiri -->
            <a-entity id="k-kiri" position="-0.5 0 0">
              <a-plane
                position="0 0.5 0"
                rotation="0 90 0"
                width="1"
                height="1"
                color="#9B59B6"
                material="side: double;"
              ></a-plane>
            </a-entity>
            <!-- Sisi Kanan -->
            <a-entity id="k-kanan" position="0.5 0 0">
              <a-plane
                position="0 0.5 0"
                rotation="0 -90 0"
                width="1"
                height="1"
                color="#2ECC71"
                material="side: double;"
              ></a-plane>
            </a-entity>
          </a-entity>

          <!-- ==================== 2. BANGUN: LIMAS SEGIEMPAT ==================== -->
          <a-entity id="group-limas" visible="false" position="0 0 0">
            <!-- Alas Segiempat -->
            <a-plane
              position="0 0 0"
              rotation="-90 0 0"
              width="1"
              height="1"
              color="#34495E"
              material="side: double;"
            ></a-plane>

            <!-- Sisi Segitiga Depan -->
            <a-entity id="l-depan" position="0 0 0.5">
              <a-triangle
                position="0 0.43 0"
                rotation="-30 0 0"
                vertex-a="0 0.5 0"
                vertex-b="-0.5 -0.5 0"
                vertex-c="0.5 -0.5 0"
                color="#E67E22"
                material="side: double;"
              ></a-triangle>
            </a-entity>
            <!-- Sisi Segitiga Belakang -->
            <a-entity id="l-belakang" position="0 0 -0.5">
              <a-triangle
                position="0 0.43 0"
                rotation="30 180 0"
                vertex-a="0 0.5 0"
                vertex-b="-0.5 -0.5 0"
                vertex-c="0.5 -0.5 0"
                color="#9B59B6"
                material="side: double;"
              ></a-triangle>
            </a-entity>
            <!-- Sisi Segitiga Kiri -->
            <a-entity id="l-kiri" position="-0.5 0 0">
              <a-triangle
                position="0 0.43 0"
                rotation="-30 90 0"
                vertex-a="0 0.5 0"
                vertex-b="-0.5 -0.5 0"
                vertex-c="0.5 -0.5 0"
                color="#1ABC9C"
                material="side: double;"
              ></a-triangle>
            </a-entity>
            <!-- Sisi Segitiga Kanan -->
            <a-entity id="l-kanan" position="0.5 0 0">
              <a-triangle
                position="0 0.43 0"
                rotation="-30 -90 0"
                vertex-a="0 0.5 0"
                vertex-b="-0.5 -0.5 0"
                vertex-c="0.5 -0.5 0"
                color="#F1C40F"
                material="side: double;"
              ></a-triangle>
            </a-entity>
          </a-entity>

          <!-- ==================== 3. BANGUN: TABUNG ==================== -->
          <a-entity id="group-tabung" visible="false" position="0 0 0">
            <!-- Alas Bawah -->
            <a-circle
              position="0 0 0"
              rotation="-90 0 0"
              radius="0.5"
              color="#2980B9"
              material="side: double;"
            ></a-circle>
            <!-- Tutup Atas -->
            <a-entity id="t-atas" position="0 1 0">
              <a-circle
                position="0 0 0"
                rotation="-90 0 0"
                radius="0.5"
                color="#2980B9"
                material="side: double;"
              ></a-circle>
            </a-entity>
            <!-- Selimut (Direpresentasikan dengan silinder open-ended) -->
            <a-cylinder
              id="t-selimut"
              position="0 0.5 0"
              radius="0.5"
              height="1"
              open-ended="true"
              color="#E74C3C"
              material="side: double;"
            ></a-cylinder>
          </a-entity>

          <!-- ==================== 4. BANGUN: KERUCUT ==================== -->
          <a-entity id="group-kerucut" visible="false" position="0 0.5 0">
            <!-- Alas Lingkaran -->
            <a-entity id="kr-alas" position="0 -0.5 0">
              <a-circle
                rotation="-90 0 0"
                radius="0.5"
                color="#27AE60"
                material="side: double;"
              ></a-circle>
            </a-entity>
            <!-- Selimut Kerucut -->
            <a-cone
              id="kr-selimut"
              position="0 0 0"
              radius-bottom="0.5"
              radius-top="0"
              height="1"
              open-ended="true"
              color="#F39C12"
              material="material: side: double;"
            ></a-cone>
          </a-entity>
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
