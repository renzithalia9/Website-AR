<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0">
    <title>Web-AR Jaring-Jaring Bangun Ruang</title>
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }
        
        /* UI Teks Instruksi - Dibuat Responsif */
        #info-box {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 13px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        /* UI Menu Pilihan Bangun Ruang - Fleksibel Mengikuti Lebar Layar HP */
        #menu-container {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.25);
            padding: 8px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 360px;
            box-sizing: border-box;
        }

        /* Tombol Menu - Menggunakan persentase agar muat di semua layar HP */
        .menu-btn {
            background: white;
            color: #333;
            border: none;
            flex: 1; /* Membuat tombol membagi ruang sama rata */
            padding: 12px 0;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-btn.active {
            background: #FF5722;
            color: white;
            transform: scale(1.05);
        }

        /* Khusus Layar Sangat Kecil (HP di bawah 360px) */
        @media screen and (max-width: 360px) {
            .menu-btn {
                font-size: 11px;
                padding: 10px 0;
            }
            #info-box {
                font-size: 11px;
            }
        }
    </style>
</head>

<body>

    <div id="info-box">Arahkan ke Marker HIRO, pilih menu, lalu ketuk objeknya!</div>

    <div id="menu-container">
        <button class="menu-btn active" onclick="switchShape('kubus')">Kubus</button>
        <button class="menu-btn" onclick="switchShape('limas')">Limas</button>
        <button class="menu-btn" onclick="switchShape('tabung')">Tabung</button>
        <button class="menu-btn" onclick="switchShape('kerucut')">Kerucut</button>
    </div>
