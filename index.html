<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0, shrink-to-fit=no">
    <title>Web-AR Jaring-Jaring Bangun Ruang</title>
    
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
        html, body { 
            margin: 0; 
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            font-family: 'Segoe UI', Roboto, sans-serif;
            position: fixed;
            background-color: #000;
        }

        /* Memaksa elemen video kamera AR.js memenuhi layar penuh tanpa terpotong hitam */
        .a-canvas {
            width: 100% !important;
            height: 100% !important;
            left: 0 !important;
            top: 0 !important;
        }
        
        #info-box {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            background: rgba(0, 0, 0, 0.85);
            color: white;
            padding: 10px 15px;
            border-radius: 15px;
            font-size: 13px;
            text-align: center;
            width: 85%;
            max-width: 400px;
            pointer-events: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        #menu-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.25);
            padding: 8px;
            border-radius: 30px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 380px;
            box-sizing: border-box;
        }

        .menu-btn {
            background: white;
            color: #333;
            border: none;
            flex: 1;
            padding: 12px 0;
            border-radius: 20px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .menu-btn.active {
            background: #FF5722;
            color: white;
            transform: scale(1.05);
        }

        @media screen and (max-width: 360px) {
            .menu-btn { font-size: 11px; padding: 10px 0; }
            #info-box { font-size: 11px; }
        }
    </style>
</head>

<body>

    <div id="info-box">Arahkan ke Marker HIRO, pilih bangun ruang, lalu ketuk objeknya!</div>

    <div id="menu-container">
        <button class="menu-btn active" onclick="switchShape('kubus')">Kubus</button>
        <button class="menu-btn" onclick="switchShape('limas')">Limas</button>
        <button class="menu-btn" onclick="switchShape('tabung')">Tabung</button>
        <button class="menu-btn" onclick="switchShape('kerucut')">Kerucut</button>
    </div>

    <script>
        let isOpen = false;

        AFRAME.registerComponent('shape-interaction', {
            init: function () {
                let el = this.el;
                
                // Mendukung event 'click' untuk desktop dan 'touchstart' khusus layar HP
                const handleInteraction = function () {
                    let activeShape = document.querySelector('#marker-content').getAttribute('data-active');
                    let info = document.querySelector('#info-box');

                    if (!isOpen) {
                        // ANIMASI MEMBUKA JARING-JARING
                        if (activeShape === 'kubus') {
                            document.querySelector('#k-depan').setAttribute('animation', 'property: rotation; to: 90 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#k-belakang').setAttribute('animation', 'property: rotation; to: -90 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#k-kiri').setAttribute('animation', 'property: rotation; to: 0 0 90; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#k-kanan').setAttribute('animation', 'property: rotation; to: 0 0 -90; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#k-atas').setAttribute('animation', 'property: rotation; to: 90 0 0; dur: 1000; easing: easeOutQuad');
                        } 
                        else if (activeShape === 'limas') {
                            document.querySelector('#l-depan').setAttribute('animation', 'property: rotation; to: 60 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#l-belakang').setAttribute('animation', 'property: rotation; to: -60 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#l-kiri').setAttribute('animation', 'property: rotation; to: 0 0 60; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#l-kanan').setAttribute('animation', 'property: rotation; to: 0 0 -60; dur: 1000; easing: easeOutQuad');
                        }
                        else if (activeShape === 'tabung') {
                            document.querySelector('#t-selimut').setAttribute('animation', 'property: position; to: 0 0 1.2; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#t-selimut').setAttribute('animation__rot', 'property: rotation; to: -90 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#t-atas').setAttribute('animation', 'property: position; to: 0 1 0; dur: 1000; easing: easeOutQuad');
                        }
                        else if (activeShape === 'kerucut') {
                            document.querySelector('#kr-selimut').setAttribute('animation', 'property: position; to: -0.6 0 0; dur: 1000; easing: easeOutQuad');
                            document.querySelector('#kr-alas').setAttribute('animation', 'property: position; to: 0.6 -0.5 0; dur: 1000; easing: easeOutQuad');
                        }

                        info.innerText = "Jaring-jaring terbuka! Ketuk objek untuk merapatkan kembali.";
                        isOpen = true;
                    } else {
                        // ANIMASI MENUTUP KEMBALI JADI BANGUN RUANG UTUH
                        resetAnimations();
                        info.innerText = "Ketuk objek untuk melihat jaring-jaring " + activeShape + ".";
                        isOpen = false;
                    }
                };

                el.addEventListener('click', handleInteraction);
            }
        });

        function resetAnimations() {
            isOpen = false;
            // Reset Kubus
            document.querySelectorAll('[id^="k-"]').forEach(el => el.removeAttribute('animation'));
            
            // Reset Limas
            document.querySelectorAll('[id^="l-"]').forEach(el => el.removeAttribute('animation'));
            
            // Reset Tabung
            document.querySelector('#t-selimut').removeAttribute('animation');
            document.querySelector('#t-selimut').removeAttribute('animation__rot');
            document.querySelector('#t-selimut').setAttribute('position', '0 0.5 0');
            document.querySelector('#t-selimut').setAttribute('rotation', '0 0 0');
            document.querySelector('#t-atas').removeAttribute('animation');
            document.querySelector('#t-atas').setAttribute('position', '0 1 0');
            
            // Reset Kerucut
            document.querySelector('#kr-selimut').removeAttribute('animation');
            document.querySelector('#kr-selimut').setAttribute('position', '0 0 0');
            document.querySelector('#kr-alas').removeAttribute('animation');
            document.querySelector('#kr-alas').setAttribute('position', '0 -0.5 0');
        }

        function switchShape(shapeName) {
            resetAnimations();
            
            document.querySelector('#group-kubus').setAttribute('visible', shapeName === 'kubus');
            document.querySelector('#group-limas').setAttribute('visible', shapeName === 'limas');
            document.querySelector('#group-tabung').setAttribute('visible', shapeName === 'tabung');
            document.querySelector('#group-kerucut').setAttribute('visible', shapeName === 'kerucut');
            
            document.querySelector('#marker-content').setAttribute('data-active', shapeName);
            document.querySelector('#info-box').innerText = "Ketuk objek untuk melihat jaring-jaring " + shapeName + ".";

            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('remove'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }
    </script>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;" 
             cursor="rayorigin: mouse; fuse: false;" raycaster="objects: .clickable">
        
        <a-marker preset="hiro">
            
            <a-entity id="marker-content" data-active="kubus" class="clickable" shape-interaction position="0 0 0" scale="0.6 0.6 0.6">
                
                <a-entity id="group-kubus" visible="true" position="0 0.2 0">
                    <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" color="#4CC3D9" material="side: double;"></a-plane>
                    
                    <a-entity id="k-depan" position="0 0 0.5">
                        <a-plane position="0 0.5 0" rotation="0 0 0" width="1" height="1" color="#FFC65D" material="side: double;"></a-plane>
                        <a-entity id="k-atas" position="0 1 0">
                            <a-plane position="0 0.5 0" rotation="-90 0 0" width="1" height="1" color="#E74C3C" material="side: double;"></a-plane>
                        </a-entity>
                    </a-entity>
                    
                    <a-entity id="k-belakang" position="0 0 -0.5">
                        <a-plane position="0 0.5 0" rotation="90 0 0" width="1" height="1" color="#16A085" material="side: double;"></a-plane>
                    </a-entity>
                    <a-entity id="k-kiri" position="-0.5 0 0">
                        <a-plane position="0 0.5 0" rotation="0 90 -90" width="1" height="1" color="#9B59B6" material="side: double;"></a-plane>
                    </a-entity>
                    <a-entity id="k-kanan" position="0.5 0 0">
                        <a-plane position="0 0.5 0" rotation="0 -90 90" width="1" height="1" color="#2ECC71" material="side: double;"></a-plane>
                    </a-entity>
                </a-entity>

                <a-entity id="group-limas" visible="false" position="0 0 0">
                    <a-plane position="0 0 0" rotation="-90 0 0" width="1" height="1" color="#34495E" material="side: double;"></a-plane>
                    
                    <a-entity id="l-depan" position="0 0 0.5">
                        <a-triangle position="0 0.43 0" rotation="-30 0 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#E67E22" material="side: double;"></a-triangle>
                    </a-entity>
                    <a-entity id="l-belakang" position="0 0 -0.5">
                        <a-triangle position="0 0.43 0" rotation="-30 180 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#9B59B6" material="side: double;"></a-triangle>
                    </a-entity>
                    <a-entity id="l-kiri" position="-0.5 0 0">
                        <a-triangle position="0 0.43 0" rotation="-30 90 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#1ABC9C" material="side: double;"></a-triangle>
                    </a-entity>
                    <a-entity id="l-kanan" position="0.5 0 0">
                        <a-triangle position="0 0.43 0" rotation="-30 -90 0" vertex-a="0 0.5 0" vertex-b="-0.5 -0.5 0" vertex-c="0.5 -0.5 0" color="#F1C40F" material="side: double;"></a-triangle>
                    </a-entity>
                </a-entity>

                <a-entity id="group-tabung" visible="false" position="0 0 0">
                    <a-circle position="0 0 0" rotation="-90 0 0" radius="0.5" color="#2980B9" material="side: double;"></a-circle>
                    <a-entity id="t-atas" position="0 1 0">
                        <a-circle position="0 0 0" rotation="-90 0 0" radius="0.5" color="#2980B9" material="side: double;"></a-circle>
                    </a-entity>
                    <a-cylinder id="t-selimut" position="0 0.5 0" radius="0.5" height="1" open-ended="true" color="#E74C3C" material="side: double;"></a-cylinder>
                </a-entity>

                <a-entity id="group-kerucut" visible="false" position="0 0.5 0">
                    <a-entity id="kr-alas" position="0 -0.5 0">
                        <a-circle rotation="-90 0 0" radius="0.5" color="#27AE60" material="side: double;"></a-circle>
                    </a-entity>
                    <a-cone id="kr-selimut" position="0 0 0" radius-bottom="0.5" radius-top="0" height="1" open-ended="true" color="#F39C12" material="side: double;"></a-cone>
                </a-entity>

            </a-entity>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

</body>
</html>
